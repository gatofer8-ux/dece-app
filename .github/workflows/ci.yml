name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci --include=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test
        env:
          NODE_ENV: test

      - name: Build
        run: npm run build
        env:
          # Secreto de prueba solo para que el build no falle en la validación
          # de entorno. NO es el secreto de producción.
          NEXTAUTH_SECRET: ci-build-only-secret-not-used-in-production-000
          NEXT_TELEMETRY_DISABLED: "1"
